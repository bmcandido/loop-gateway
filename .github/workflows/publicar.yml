# Publica os gateways no Supabase quando o código deles muda na main. Sem teste passando, não publica.
# Precisa do segredo SUPABASE_ACCESS_TOKEN no repositório (docs/VISAO-GERAL.md).
name: Publicar gateway

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

# Dois pushes seguidos publicam em ordem: um não cancela o outro no meio.
concurrency:
  group: publicar-gateway
  cancel-in-progress: false

env:
  PROJETO: zvncvdlfyeyktnuzxvlc

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes
        run: npm test

      - name: Conferir o acesso ao Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN no repositório. Nada foi publicado."
            exit 1
          fi

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 3.0.0

      - name: Publicar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for funcao in portal-gateway expense-gateway; do
            supabase functions deploy "$funcao" --project-ref "$PROJETO" --no-verify-jwt --use-api --yes
          done

      - name: Conferir no ar
        run: |
          for funcao in portal-gateway expense-gateway; do
            url="https://$PROJETO.supabase.co/functions/v1/$funcao/saude"
            curl --silent --show-error --fail --retry 5 --retry-delay 5 --retry-all-errors --max-time 15 "$url" | grep -q '"ok":true'
            echo "$funcao no ar"
          done
